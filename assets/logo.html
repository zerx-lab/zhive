<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    .wrap {
        display: flex;
        flex-direction: column;
        gap: 1px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--color-border-tertiary);
    }
    .panel {
        padding: 44px 48px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .pl {
        background: #f5f4ee;
    }
    .pd {
        background: #131311;
    }
    .sep {
        height: 1px;
        background: var(--color-border-tertiary);
    }
    .marks {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
        flex-wrap: wrap;
    }
    .mc {
        border-radius: 10px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .mcl {
        background: #f5f4ee;
    }
    .mcd {
        background: #131311;
    }
    .label {
        text-align: center;
        font-size: 11px;
        color: var(--color-text-secondary);
        margin-top: 8px;
        letter-spacing: 0.06em;
    }
</style>
