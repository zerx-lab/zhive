[package]
name        = "xtask"
description = "Development tasks for the zhive workspace (proto codegen, hakari, release)."
version     = "0.0.0"
publish     = false
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap   = { workspace = true }
schemars.workspace = true
serde_json.workspace = true
zhive-proto = { workspace = true, features = ["schema"] }
