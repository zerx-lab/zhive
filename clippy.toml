# Proper nouns that `clippy::doc_markdown` (in the `pedantic` group) would
# otherwise demand be wrapped in backticks. These are brand/model names, not
# code identifiers, so they read better unquoted. The `".."` entry preserves
# clippy's built-in default identifier list (OpenGL, macOS, …).
doc-valid-idents = [
    "OpenAI",
    "GPT-5",
    "GPT-5.1",
    "GPT-5.2",
    "GPT-5.3",
    "GPT-5.4",
    "GPT-5.5",
    "..",
]
