[package]
name        = "zhive-cli"
description = "The `zhive` binary: unified dispatcher for tui / serve / bridge subcommands."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lints]
workspace = true

[[bin]]
name = "zhive"
path = "src/main.rs"

# Bin crates are leaf nodes: no other crate may depend on `zhive-cli`.
# Subcommands turn on via Cargo features so non-default ones do not pay
# the compile cost. The default build ships the in-process engine (tui +
# serve), the stdio bridge, and the three capability layers (mcp / acp /
# skills); each can be dropped independently for a slimmer binary.
[features]
default      = ["tui", "serve", "bridge-stdio", "mcp", "acp", "skills"]
# The in-process engine plus the Anthropic/OpenAI provider builders. Pulled
# in by both `tui` and `serve`; `bridge-stdio` deliberately omits it because
# it only pipes bytes to an already-running engine socket (D-002 / D-004).
# `zhive-core/tools` enables the built-in coding tools registered in `boot`.
engine       = ["dep:zhive-core", "dep:llmsdk", "zhive-core/tools"]
tui          = ["engine", "dep:zhive-tui"]
serve        = ["engine"]
bridge-stdio = ["dep:zhive-bridge-stdio"]
# Capability layers wired into the engine's tool registry / serving path.
# `mcp` connects to MCP servers and registers their tools; `skills` discovers
# on-disk Agent-Skills (needs the engine's `zhive-core/skills` module); `acp`
# adds the `zhive acp` subcommand that serves the engine over the ACP stdio
# protocol. All three need the in-process engine, so they imply `engine`.
mcp          = ["engine", "dep:zhive-mcp"]
acp          = ["engine", "dep:zhive-bridge-acp"]
skills       = ["engine", "zhive-core/skills"]
full         = ["tui", "serve", "bridge-stdio", "mcp", "acp", "skills"]

[dependencies]
zhive-tui           = { workspace = true, optional = true }
zhive-core          = { workspace = true, optional = true }
zhive-bridge-stdio  = { workspace = true, optional = true }
zhive-mcp           = { workspace = true, optional = true }
zhive-bridge-acp    = { workspace = true, optional = true }
zhive-client-native = { workspace = true }
zhive-proto         = { workspace = true }

tokio              = { workspace = true }
tokio-util         = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
serde              = { workspace = true }
toml               = { workspace = true }
llmsdk = { workspace = true, features = ["amazon-bedrock", "anthropic", "anthropic-aws", "azure", "cohere", "google", "google-vertex", "mistral", "openai", "xai"], optional = true }
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
minijinja = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
