[package]
name        = "zhive-client-native"
description = "Native Rust JSON-RPC client for zhive (consumed by TUI and bridges)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lints]
workspace = true

[features]
# Phase 1 ships both transports unconditionally (D-004). TLS / TCP land in
# Phase 3 along with the remote story.
default = []

[dependencies]
zhive-proto = { workspace = true }

tokio       = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
bytes       = { workspace = true }
serde_json  = { workspace = true }
