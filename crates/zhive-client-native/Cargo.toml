[package]
name        = "zhive-client-native"
description = "Native Rust JSON-RPC client for zhive (consumed by TUI and bridges)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lints]
workspace = true

[features]
# Phase 1 ships both transports unconditionally (D-004). TLS / TCP land in
# Phase 3 along with the remote story.
default = []

[dependencies]
zhive-proto = { workspace = true }
tokio       = { workspace = true, features = ["io-std", "net", "time"] }
async-trait = { workspace = true }
futures     = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
bytes       = { workspace = true }
serde_json  = { workspace = true }
tokio-util.workspace = true

[dev-dependencies]
# `test-util` enables `tokio::time::pause` / `advance` / `start_paused` used
# by the shutdown-timeout test.  Not needed at runtime; tokio is already a
# regular dependency so this only activates an extra feature in tests.
tokio = { workspace = true, features = ["test-util"] }
