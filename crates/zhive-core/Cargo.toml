[package]
name        = "zhive-core"
description = "Agent runtime engine: threads, turns, items, tool dispatch, LLM glue."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lints]
workspace = true

# Feature topology (per D-009 build-optimization plan):
#   * `default`     -> minimal usable engine
#   * `sandbox`     -> Landlock / Seatbelt / Job Object adapters (Phase 3)
#   * `skills`      -> on-disk Agent-Skills discovery (SKILL.md loader). Gated
#                      so pure-engine consumers do not compile the YAML parser.
#   * `tools`       -> built-in coding tools (read/write/edit/grep/glob/ls/bash).
#                      Gated so a host that injects its own tools does not pull
#                      `ignore` / `regex` / `glob`.
[features]
default = []
# Enable the real OpenTelemetry SDK tracer-provider and the tracing bridge.
# Disabled by default (decision-diffs §2.6 method b); Phase 2 will activate
# this once an OTLP exporter target is confirmed.
otel    = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk"]
sandbox = []
skills  = ["dep:serde_norway"]
tools   = ["dep:ignore", "dep:regex", "dep:glob"]

[dependencies]
zhive-proto = { workspace = true }
tokio = { workspace = true, features = ["io-std", "process"] }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

# Persistence: sqlx replaces rusqlite per the 2026-05-28 user decision.
# The `macros` feature is enabled at the workspace level only to embed
# migrations via `sqlx::migrate!`; the `query!` / `query_as!` macros are
# avoided so that `cargo check -p <crate>` does not need `DATABASE_URL`.
sqlx = { workspace = true }

# Hook input re-validation after PreToolUse mutation (red line 11).
jsonschema = { workspace = true }

# LLM provider abstraction (D-010 Phase 1 dependency).
llmsdk = { workspace = true }

# OpenTelemetry layer for `tracing` — disabled by default (decision-diffs §2.6
# method b). Enable with `--features otel`; Phase 2 will activate this in the
# default feature set once an OTLP exporter target is confirmed.
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry         = { workspace = true, optional = true }
opentelemetry_sdk     = { workspace = true, optional = true }
serde_norway = { version = "0.9.42", optional = true }

# Built-in coding tools (read / write / edit / grep / glob / ls / bash) behind
# the `tools` feature. `ignore` + `regex` + `glob` were user-approved
# 2026-06-02; see the workspace manifest for rationale.
ignore = { workspace = true, optional = true }
regex  = { workspace = true, optional = true }
glob   = { workspace = true, optional = true }

# Safe syscall wrappers; only the UDS fallback path uses
# `rustix::process::getuid` to compose `/tmp/zhive-<uid>.sock` without
# resorting to unsafe libc bindings (red line 2).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tokio              = { workspace = true, features = ["test-util"] }
tempfile           = { workspace = true }
zhive-client-native.workspace = true
